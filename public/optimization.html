<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Run Optimization</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Run LP Optimization</h1>

      <nav>
        <a href="projects.html">Add Project</a>
        <a href="resources.html">Add Resources</a>
        <a href="optimization.html">Run Optimization</a>
      </nav>

      <div class="card">
        <h2>Select Project</h2>

        <select id="optimizationProject">
          <option value="">Select Project</option>
        </select>

        <input
          type="number"
          id="maxBudget"
          placeholder="Maximum Budget"
          required
        />

        <input
          type="number"
          id="maxLabor"
          placeholder="Maximum Labor"
          required
        />

        <input
          type="number"
          id="maxTime"
          placeholder="Maximum Time (days)"
          required
        />

        <h3>Criteria Weights</h3>

        <input
          type="number"
          step="0.01"
          id="weightCost"
          placeholder="Cost Weight"
          value="0.25"
        />

        <input
          type="number"
          step="0.01"
          id="weightEfficiency"
          placeholder="Efficiency Weight"
          value="0.25"
        />

        <input
          type="number"
          step="0.01"
          id="weightUrgency"
          placeholder="Urgency Weight"
          value="0.25"
        />

        <input
          type="number"
          step="0.01"
          id="weightAvailability"
          placeholder="Availability Weight"
          value="0.15"
        />

        <input
          type="number"
          step="0.01"
          id="weightRisk"
          placeholder="Risk Weight"
          value="0.10"
        />

        <button id="runOptimizationBtn">Run LP-MCDM Optimization</button>

        <p id="optimizationMessage"></p>
      </div>

      <div class="card">
        <h2>Optimization Result</h2>
        <div id="optimizationResult"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
