<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Project</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Infrastructure Resource Optimization</h1>

      <nav>
        <a href="projects.html">Add Project</a>
        <a href="resources.html">Add Resources</a>
        <a href="optimization.html">Run Optimization</a>
      </nav>

      <div class="card">
        <h2>Add Project</h2>

        <form id="projectForm">
          <input
            type="text"
            id="projectName"
            placeholder="Project Name"
            required
          />

          <textarea
            id="projectDescription"
            placeholder="Project Description"
            required
          ></textarea>

          <input
            type="number"
            id="totalBudget"
            placeholder="Total Budget"
            required
          />

          <input
            type="text"
            id="objective"
            placeholder="Objective"
            value="Maximize resource efficiency"
          />

          <button type="submit">Save Project</button>
        </form>

        <p id="projectMessage"></p>
      </div>

      <div class="card">
        <h2>Project List</h2>
        <div id="projectList"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
