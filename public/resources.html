<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Resources</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Add Project Resources</h1>

      <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Add Project</a>
        <a href="resources.html">Add Resources</a>
        <a href="optimization.html">Run Optimization</a>
      </nav>

      <div class="card">
        <h2>Add Resource</h2>

        <form id="resourceForm">
          <input type="hidden" id="editingResourceId" />

          <select id="resourceProject" required>
            <option value="">Select Project</option>
          </select>

          <input
            type="text"
            id="resourceName"
            placeholder="Resource Name"
            required
          />

          <select id="resourceType" required>
            <option value="">Select Type</option>
            <option value="Manpower">Manpower</option>
            <option value="Equipment">Equipment</option>
            <option value="Material">Material</option>
          </select>

          <input type="number" id="resourceCost" placeholder="Cost" required />

          <input
            type="number"
            id="resourceEfficiency"
            placeholder="Efficiency (1-10)"
            min="1"
            max="10"
            required
          />

          <input
            type="number"
            id="resourceUrgency"
            placeholder="Urgency (1-10)"
            min="1"
            max="10"
            required
          />

          <input
            type="number"
            id="resourceAvailability"
            placeholder="Availability (1-10)"
            min="1"
            max="10"
            required
          />

          <input
            type="number"
            id="resourceRisk"
            placeholder="Risk (1-10)"
            min="1"
            max="10"
            required
          />

          <input
            type="number"
            id="laborRequired"
            placeholder="Labor Required"
            required
          />

          <input
            type="number"
            id="timeRequired"
            placeholder="Time Required (days)"
            required
          />

          <button type="submit" id="resourceSubmitBtn">Save Resource</button>

          <button
            type="button"
            id="cancelEditBtn"
            class="secondary-btn"
            style="display: none"
          >
            Cancel Edit
          </button>
        </form>

        <p id="resourceMessage"></p>
      </div>

      <div class="card">
        <h2>Resources Added</h2>

        <select id="resourceListProject">
          <option value="">Select Project to View Resources</option>
        </select>

        <div id="resourceList"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
